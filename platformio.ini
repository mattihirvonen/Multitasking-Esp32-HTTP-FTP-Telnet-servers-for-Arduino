; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; PlatformIO use officially only out of date Arduino API 2.0 (libraries)
; https://github.com/pioarduino/platform-espressif32
; https://github.com/platformio/platform-espressif32/issues/1225
; platform = espressif32

; Fix: Use newer fork of PlatformIO tools for ESP processors
; Use: VScode blugin "pioarduino" instead of "platformio"
; https://github.com/pioarduino/platform-espressif32
; https://github.com/sivar2311/platform-espressif32-versions/blob/main/README.md
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200

lib_deps =
    LittleFS

; build_unflags = -std=gnu++11

; Compatibility with Arduino IDE/CLI default setting:
; Disable ALL compiler default warnings with command line option "-w"
build_flags =
    -std=c++17
    -w
